name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer update --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/phpunit
      - name: Build catalog
        if: matrix.php == '8.3'
        run: composer docs -- --strict
      - uses: actions/setup-node@v4
        if: matrix.php == '8.3'
        with:
          node-version: '22'
      - name: JS unit tests
        if: matrix.php == '8.3'
        run: composer test-js
